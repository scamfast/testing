name: build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Daftar file
        shell: bash
        run: |
          pwd
          git ls-files
          find . -path ./.git -prune -o -type f -name '*.m' -print

      - name: Siapkan SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          [ -d "$SDK" ] || { echo "SDK tidak ketemu"; exit 1; }
          echo "Pakai SDK: $SDK ($(xcrun --sdk iphoneos --show-sdk-version))"
          echo "SDK=$SDK" >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t SRC < <(find . -path ./.git -prune -o -type f \
            \( -name '*.m' -o -name '*.mm' -o -name '*.c' \) -print | sort)
          [ "${#SRC[@]}" -gt 0 ] || { echo "Tidak ada file sumber"; exit 1; }
          printf 'Sumber: %s\n' "${SRC[@]}"
          CFLAGS=(
            -dynamiclib
            -isysroot "$SDK"
            -fobjc-arc
            -Wno-deprecated-declarations
            -framework Foundation
            -framework UIKit
            -framework AVFoundation
            -framework CoreMedia
            -framework CoreVideo
            -framework Security
            -framework PhotosUI
            -Wl,-undefined,dynamic_lookup
          )
          for A in arm64 arm64e; do
            clang "${CFLAGS[@]}" -target "$A-apple-ios15.0" \
              "${SRC[@]}" -o "/tmp/$A.dylib"
          done
          lipo -create /tmp/arm64.dylib /tmp/arm64e.dylib -output libSystemExt.dylib
          codesign -s - --force libSystemExt.dylib
          lipo -info libSystemExt.dylib
          lipo -info libSystemExt.dylib | grep -q arm64e

      - uses: actions/upload-artifact@v4
        with:
          name: libSystemExt
          path: libSystemExt.dylib
