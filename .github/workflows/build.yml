name: build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Siapkan SDK
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          [ -d "$SDK" ] || { echo "SDK tidak ketemu"; exit 1; }
          echo "Pakai SDK: $SDK ($(xcrun --sdk iphoneos --show-sdk-version))"
          echo "SDK=$SDK" >> "$GITHUB_ENV"

      - name: Build
        run: |
          set -euo pipefail
          CFLAGS=(
            -dynamiclib
            -isysroot "$SDK"
            -fobjc-arc
            -Wno-deprecated-declarations
            -framework Foundation
            -framework UIKit
            -framework AVFoundation
            -framework CoreMedia
            -framework CoreVideo
            -framework Security
            -framework PhotosUI
            -Wl,-undefined,dynamic_lookup
          )
          for A in arm64 arm64e; do
            clang "${CFLAGS[@]}" -target "$A-apple-ios15.0" \
              main.m panel.m fishhook.c -o "/tmp/$A.dylib"
          done
          lipo -create /tmp/arm64.dylib /tmp/arm64e.dylib -output libSystemExt.dylib
          codesign -s - --force libSystemExt.dylib
          lipo -info libSystemExt.dylib
          lipo -info libSystemExt.dylib | grep -q arm64e

      - uses: actions/upload-artifact@v4
        with:
          name: libSystemExt
          path: libSystemExt.dylib
